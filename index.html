<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--g1:#ecf7e6;--g2:#d4eacc;--g3:#b8d9a8;--g4:#84a38d;--g5:#5c7a65;--r:18px;--br:16px;--ff:'Nunito',sans-serif}
#app{display:flex;height:600px}
#sidebar{width:192px;flex-shrink:0;background:var(--g2);border-radius:24px 0 0 24px;padding:14px 10px 14px;display:flex;flex-direction:column;overflow:hidden}
#sidebar-top{flex:1;display:flex;flex-direction:column;gap:5px;overflow-y:auto;overflow-x:hidden;min-height:0}
#sidebar-footer{padding-top:10px;border-top:1.5px solid var(--g3);margin-top:4px}
#main{flex:1;display:flex;flex-direction:column;background:var(--g1);border-radius:0 24px 24px 0;overflow:hidden}
#header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1.5px solid var(--g2)}
#content{flex:1;padding:14px 18px;overflow:hidden;display:flex;flex-direction:column}
.sb-top{font-size:13px;font-weight:700;color:var(--g5);padding:0 4px;margin-bottom:4px;display:flex;align-items:center;gap:6px;font-family:var(--ff)}
.sb-btn{background:transparent;border:1.5px solid var(--g3);border-radius:var(--br);padding:8px 10px;font-size:11px;color:var(--g5);cursor:pointer;text-align:center;transition:.15s;width:100%;font-family:var(--ff);font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.sb-btn:hover{background:var(--g3)}
.sb-btn.active{background:var(--g4);color:#fff;border-color:var(--g4)}
.help-btn{background:transparent;border:1.5px solid var(--g3);border-radius:var(--br);padding:7px 10px;font-size:11px;color:var(--g4);cursor:pointer;width:100%;font-family:var(--ff);font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.help-btn:hover{background:var(--g3);color:var(--g5)}
.sb-label-row{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 3px}
.sb-label{font-size:9px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.08em;font-family:var(--ff)}
.add-week-btn{background:var(--g4);color:#fff;border:none;border-radius:10px;width:20px;height:20px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--ff);font-weight:700;line-height:1;flex-shrink:0}
.add-week-btn:hover{background:var(--g5)}
.week-block{display:flex;flex-direction:column;gap:3px}
.week-swipe-wrap{position:relative;overflow:hidden;border-radius:var(--br)}
.week-delete-bg{position:absolute;right:0;top:0;bottom:0;width:60px;background:#e07070;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-family:var(--ff);font-weight:700;border-radius:var(--br);pointer-events:none}
.week-header{position:relative;display:flex;align-items:center;gap:5px;cursor:pointer;padding:6px 8px;border-radius:var(--br);transition:transform .2s ease,background .15s;background:var(--g3);user-select:none;touch-action:pan-y}
.week-header:hover{background:var(--g4)}
.week-header:hover .week-label,.week-header:hover .week-arrow{color:#fff}
.week-header.open{background:var(--g4)}
.week-header.open .week-label,.week-header.open .week-arrow{color:#fff}
.week-label{font-size:11px;font-weight:700;color:var(--g5);font-family:var(--ff);flex:1}
.week-arrow{font-size:10px;color:var(--g4);transition:transform .2s;line-height:1}
.week-header.open .week-arrow{transform:rotate(90deg)}
.week-days{display:flex;flex-direction:column;gap:3px;padding-left:10px;overflow:hidden;transition:max-height .25s ease}
.week-days.collapsed{max-height:0}
.week-days.expanded{max-height:300px}
.day-btn{background:transparent;border:1.5px solid var(--g3);border-radius:12px;padding:5px 8px;font-size:10px;color:var(--g5);cursor:pointer;text-align:center;transition:.15s;width:100%;font-family:var(--ff);font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.day-btn:hover{background:var(--g3)}
.day-btn.active{background:var(--g4);color:#fff;border-color:var(--g4)}
#streak{font-size:13px;font-weight:700;color:var(--g5);font-family:var(--ff)}
#day-label{font-size:12px;color:var(--g4);font-weight:700;font-family:var(--ff)}
.sec-title{font-size:15px;font-weight:700;color:var(--g5);margin-bottom:8px;text-align:center;font-family:var(--ff)}
.word-count-bar{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px}
.word-count-pill{background:var(--g3);color:var(--g5);border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;font-family:var(--ff)}
.input-row{display:flex;gap:8px;margin-bottom:10px}
.inp{flex:1;background:#fff;border:1.5px solid var(--g3);border-radius:var(--br);padding:9px 12px;font-size:11px;color:var(--g5);outline:none;font-family:var(--ff);font-weight:600;text-align:center}
.inp:focus{border-color:var(--g4)}
.btn-add{background:var(--g4);color:#fff;border:none;border-radius:var(--br);padding:9px 14px;font-size:11px;cursor:pointer;font-weight:700;font-family:var(--ff)}
.btn-add:hover{background:var(--g5)}
.word-list{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;max-height:150px;overflow-y:auto}
.word-tag{display:flex;align-items:center;background:var(--g2);border-radius:var(--br);padding:6px 12px;font-size:10px;color:var(--g5);font-family:var(--ff);font-weight:600}
.word-tag span{flex:1;text-align:center}
.word-tag .del{background:transparent;border:none;color:var(--g4);cursor:pointer;font-size:14px}
.btn-start{background:var(--g4);color:#fff;border:none;border-radius:var(--br);padding:10px 24px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--ff)}
.btn-start:hover{background:var(--g5)}
.btn-start:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:var(--g2);color:var(--g5);border:none;border-radius:var(--br);padding:10px 24px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--ff)}
.btn-ghost:hover{background:var(--g3)}
.info-bar{display:flex;gap:7px;align-items:center;justify-content:center;margin-bottom:8px;flex-shrink:0}
.badge{font-size:10px;font-weight:700;background:var(--g2);color:var(--g5);border-radius:20px;padding:4px 12px;font-family:var(--ff)}
.match-layout{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}
.col-lbl{font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;text-align:center;font-family:var(--ff);flex-shrink:0}
.col-wrap{display:flex;flex-direction:column;min-height:0}
.col-cards{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0}
.mcard{background:#fff;border:2px solid var(--g3);border-radius:var(--r);padding:4px 8px;font-size:11px;font-weight:600;color:var(--g5);cursor:pointer;transition:border-color .13s,background .13s,opacity .2s;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--ff);word-break:break-word;line-height:1.3;flex:1;min-height:0}
.mcard:hover:not(.matched):not(.wrong):not(.locked){border-color:var(--g4);background:var(--g1)}
.mcard.selected{border-color:var(--g5);background:var(--g2);border-width:2.5px}
.mcard.matched{opacity:.25;cursor:default;border-color:var(--g3);background:var(--g2)}
.mcard.wrong{border-color:#d97272;background:#fff0f0;animation:shk .35s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.result-box{background:var(--g2);border-radius:24px;padding:24px 20px;text-align:center;max-width:320px;margin:0 auto}
.result-box h3{font-size:16px;font-weight:700;color:var(--g5);margin-bottom:8px;font-family:var(--ff)}
.result-box p{font-size:11px;color:var(--g4);margin-bottom:16px;font-family:var(--ff);font-weight:600;line-height:1.6}
.week-filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
.wf-btn{background:var(--g2);border:1.5px solid var(--g3);border-radius:20px;padding:5px 14px;font-size:11px;font-weight:700;color:var(--g5);cursor:pointer;font-family:var(--ff);transition:.15s}
.wf-btn:hover{background:var(--g3)}
.wf-btn.active{background:var(--g4);color:#fff;border-color:var(--g4)}
.vtable{width:100%;border-collapse:collapse}
.vtable th{font-size:10px;font-weight:700;color:var(--g4);text-align:center;padding:6px 10px;border-bottom:1.5px solid var(--g3);font-family:var(--ff)}
.vtable td{font-size:10px;font-weight:600;color:var(--g5);padding:7px 10px;border-bottom:1px solid var(--g2);text-align:center;font-family:var(--ff)}
.vtable tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:10px;font-weight:700;background:var(--g3);color:var(--g5);border-radius:20px;padding:2px 8px;font-family:var(--ff)}
.msg{font-size:12px;color:var(--g4);text-align:center;padding:24px;opacity:.7;font-family:var(--ff);font-weight:600}
.confirm-overlay{background:rgba(92,122,101,.15);border-radius:16px;padding:14px;margin-top:4px}
.confirm-overlay p{font-size:11px;color:var(--g5);font-family:var(--ff);font-weight:700;margin-bottom:8px;text-align:center}
.confirm-overlay .btn-row{display:flex;gap:8px;justify-content:center}
.del-confirm-btn{background:#e07070;color:#fff;border:none;border-radius:12px;padding:6px 16px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--ff)}
.cancel-btn{background:var(--g2);color:var(--g5);border:none;border-radius:12px;padding:6px 16px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--ff)}
.page-dot-row{display:flex;gap:5px;justify-content:center;margin-bottom:8px;flex-shrink:0}
.page-dot{width:7px;height:7px;border-radius:50%;background:var(--g3)}
.page-dot.active{background:var(--g4)}
#onboarding{position:absolute;inset:0;background:rgba(132,163,141,.32);border-radius:24px;display:flex;align-items:center;justify-content:center;z-index:100}
.ob-card{background:#fff;border-radius:24px;width:82%;max-width:340px;padding:28px 24px 20px;display:flex;flex-direction:column;align-items:center}
.ob-pic{width:100%;display:flex;justify-content:center;margin-bottom:14px}
.ob-text{font-family:var(--ff);font-size:12px;font-weight:600;color:var(--g5);text-align:center;line-height:1.75;margin-bottom:18px}
.ob-text b{font-weight:700;color:var(--g4)}
.ob-bottom{width:100%;display:flex;align-items:center;justify-content:space-between}
.ob-dots{display:flex;gap:6px;align-items:center}
.ob-dot{width:7px;height:7px;border-radius:50%;background:var(--g3);transition:.2s}
.ob-dot.active{background:var(--g4);width:18px;border-radius:4px}
.ob-arrow{background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px}
.ob-arrow svg{width:28px;height:28px}
.ob-skip{font-family:var(--ff);font-size:10px;font-weight:700;color:var(--g4);background:none;border:none;cursor:pointer;padding:0;min-width:32px}
.ob-skip:hover{text-decoration:underline}
.ob-lang-bar{display:flex;gap:5px;justify-content:center;margin-bottom:12px;width:100%}
.ob-lang-btn{background:transparent;border:1.5px solid var(--g3);border-radius:20px;padding:3px 11px;font-size:10px;font-weight:700;color:var(--g4);cursor:pointer;font-family:var(--ff);transition:.15s}
.ob-lang-btn:hover{background:var(--g2)}
.ob-lang-btn.active{background:var(--g4);color:#fff;border-color:var(--g4)}
#app-wrap{position:relative;display:inline-block;width:100%}

/* ── Bulk Import Modal ── */
#bulk-overlay{position:absolute;inset:0;background:rgba(92,122,101,.45);border-radius:24px;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.bulk-card{background:#fff;border-radius:22px;width:100%;max-width:420px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:12px}
.bulk-title{font-size:14px;font-weight:700;color:var(--g5);font-family:var(--ff)}
.bulk-hint{font-size:10px;color:var(--g4);font-weight:600;font-family:var(--ff);line-height:1.6;background:var(--g1);border-radius:10px;padding:8px 12px}
.bulk-hint code{font-family:var(--ff);background:var(--g2);border-radius:4px;padding:1px 5px;font-size:10px}
.bulk-textarea{width:100%;min-height:160px;border:1.5px solid var(--g3);border-radius:var(--br);padding:10px 12px;font-size:12px;font-family:var(--ff);font-weight:600;color:var(--g5);resize:vertical;outline:none;line-height:1.7}
.bulk-textarea:focus{border-color:var(--g4)}
.bulk-textarea::placeholder{color:var(--g3);font-weight:500}
.bulk-preview{max-height:100px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.bulk-preview-row{font-size:10px;font-family:var(--ff);font-weight:600;color:var(--g5);background:var(--g2);border-radius:8px;padding:4px 10px;display:flex;gap:6px;align-items:center}
.bulk-preview-row .bpr-word{color:var(--g5);min-width:60px}
.bulk-preview-row .bpr-sep{color:var(--g3)}
.bulk-preview-row .bpr-mean{color:var(--g4);flex:1}
.bulk-preview-row.err{background:#fff0f0;color:#d97272}
.bulk-preview-count{font-size:10px;font-weight:700;color:var(--g4);font-family:var(--ff);text-align:right}
.bulk-btn-row{display:flex;gap:8px;justify-content:flex-end}
.btn-bulk-open{background:var(--g2);color:var(--g4);border:1.5px solid var(--g3);border-radius:var(--br);padding:9px 14px;font-size:11px;cursor:pointer;font-weight:700;font-family:var(--ff);display:flex;align-items:center;gap:5px;transition:.15s}
.btn-bulk-open:hover{background:var(--g3)}

/* ── Sync Modal ── */
.sync-btn{background:transparent;border:1.5px solid var(--g3);border-radius:var(--br);padding:7px 10px;font-size:11px;color:var(--g4);cursor:pointer;width:100%;font-family:var(--ff);font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s;margin-top:5px}
.sync-btn:hover{background:var(--g3);color:var(--g5)}
#sync-overlay{position:absolute;inset:0;background:rgba(92,122,101,.45);border-radius:24px;display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.sync-card{background:#fff;border-radius:22px;width:100%;max-width:400px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px}
.sync-card-title{font-size:14px;font-weight:700;color:var(--g5);font-family:var(--ff);display:flex;align-items:center;gap:6px}
.sync-section{display:flex;flex-direction:column;gap:8px}
.sync-section-label{font-size:10px;font-weight:700;color:var(--g4);text-transform:uppercase;letter-spacing:.07em;font-family:var(--ff)}
.sync-export-box{background:var(--g1);border:1.5px solid var(--g3);border-radius:var(--br);padding:10px 14px;font-size:11px;font-family:monospace;color:var(--g5);word-break:break-all;line-height:1.6;max-height:64px;overflow-y:auto;user-select:all}
.sync-copy-btn{background:var(--g4);color:#fff;border:none;border-radius:var(--br);padding:12px;font-size:13px;cursor:pointer;font-weight:700;font-family:var(--ff);width:100%;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.sync-copy-btn:hover{background:var(--g5)}
.sync-copy-btn.copied{background:var(--g5)}
.sync-textarea{width:100%;height:72px;border:1.5px solid var(--g3);border-radius:var(--br);padding:9px 12px;font-size:11px;font-family:var(--ff);color:var(--g5);resize:none;outline:none;line-height:1.5;background:#fff}
.sync-textarea:focus{border-color:var(--g4)}
.sync-textarea::placeholder{color:var(--g3);font-weight:500}
.sync-import-btn{background:var(--g4);color:#fff;border:none;border-radius:var(--br);padding:10px;font-size:12px;cursor:pointer;font-weight:700;font-family:var(--ff);width:100%;transition:.15s}
.sync-import-btn:hover{background:var(--g5)}
.sync-import-btn:disabled{opacity:.4;cursor:not-allowed}
.sync-divider{border:none;border-top:1.5px solid var(--g2);margin:0}
.sync-close-btn{background:var(--g2);color:var(--g5);border:none;border-radius:var(--br);padding:8px;font-size:11px;cursor:pointer;font-weight:700;font-family:var(--ff);width:100%;transition:.15s}
.sync-close-btn:hover{background:var(--g3)}
.sync-size-hint{font-size:10px;color:var(--g4);font-family:var(--ff);font-weight:600;text-align:right}

/* ── 언어 모드 switcher ── */
#lang-switcher{display:flex;align-items:center;gap:5px;flex-shrink:0}
.lang-mode-btn{background:var(--g2);border:1.5px solid var(--g3);border-radius:20px;padding:3px 7px;font-size:10px;font-weight:700;color:var(--g4);cursor:pointer;font-family:var(--ff);transition:.15s;white-space:nowrap;flex-shrink:0}
.lang-mode-btn:hover{background:var(--g3)}
.lang-mode-btn.active{background:var(--g4);color:#fff;border-color:var(--g4)}
/* 핑크 팔레트 */
.lang-mode-btn.c-pink{background:#fde8f0;border-color:#f4a7c3;color:#c2567a}
.lang-mode-btn.c-pink:hover{background:#f9cfe0}
.lang-mode-btn.c-pink.active{background:#e8799f;border-color:#e8799f;color:#fff}
/* 노랑 팔레트 */
.lang-mode-btn.c-yellow{background:#fef7db;border-color:#f0d060;color:#9a7c1a}
.lang-mode-btn.c-yellow:hover{background:#fdf0b8}
.lang-mode-btn.c-yellow.active{background:#d4a820;border-color:#d4a820;color:#fff}
/* 파랑 팔레트 */
.lang-mode-btn.c-blue{background:#deedfb;border-color:#85bff0;color:#2c72b5}
.lang-mode-btn.c-blue:hover{background:#c8e0f8}
.lang-mode-btn.c-blue.active{background:#4a8fd4;border-color:#4a8fd4;color:#fff}
.lang-add-btn{background:var(--g4);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;line-height:1}
.lang-add-btn:hover{background:var(--g5)}
.lang-add-btn:disabled{opacity:.35;cursor:not-allowed}

/* ── 언어 관리 모달 ── */
#lang-modal-overlay{position:absolute;inset:0;background:rgba(92,122,101,.45);border-radius:24px;display:flex;align-items:center;justify-content:center;z-index:400;padding:16px}
.lang-modal-card{background:#fff;border-radius:22px;width:100%;max-width:340px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px}
.lang-modal-title{font-size:14px;font-weight:700;color:var(--g5);font-family:var(--ff)}
.lang-item{display:flex;align-items:center;gap:8px;background:var(--g1);border-radius:12px;padding:8px 12px}
.lang-item-name{flex:1;font-size:12px;font-weight:700;color:var(--g5);font-family:var(--ff);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-item-edit{background:var(--g2);border:none;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--g4);cursor:pointer;font-family:var(--ff)}
.lang-item-del{background:#e07070;border:none;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--ff)}
.lang-item-del:disabled{opacity:.3;cursor:not-allowed}
.lang-color-row{display:flex;gap:6px;align-items:center;margin-top:4px}
.lang-color-label{font-size:10px;font-weight:700;color:var(--g4);font-family:var(--ff)}
.lang-swatch{width:22px;height:22px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:.15s;flex-shrink:0}
.lang-swatch:hover{transform:scale(1.15)}
.lang-swatch.selected{border-color:var(--g5);transform:scale(1.1)}
.lang-add-row{display:flex;gap:8px}
.lang-name-inp{flex:1;border:1.5px solid var(--g3);border-radius:var(--br);padding:8px 12px;font-size:12px;font-family:var(--ff);font-weight:600;color:var(--g5);outline:none}
.lang-name-inp:focus{border-color:var(--g4)}
.lang-confirm-btn{background:var(--g4);color:#fff;border:none;border-radius:var(--br);padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--ff)}
.lang-confirm-btn:hover{background:var(--g5)}
.lang-modal-close{background:var(--g2);color:var(--g5);border:none;border-radius:var(--br);padding:8px;font-size:11px;cursor:pointer;font-weight:700;font-family:var(--ff);width:100%}
.lang-modal-close:hover{background:var(--g3)}

/* ── 언어 색상 팔레트 ── */
/* pink */  .lc-pink .lang-mode-btn{border-color:#c47f8a;color:#c47f8a} .lc-pink .lang-mode-btn.active{background:#c47f8a;border-color:#c47f8a;color:#fff}

<script>
const SK='vocab7d_v8';
function load(){try{return JSON.parse(localStorage.getItem(SK))||null}catch{return null}}
function save(s){
  try{
    localStorage.setItem(SK,JSON.stringify(s));
  }catch(e){
    console.error('저장 실패:',e);
    // Safari file:// 등 localStorage 차단 환경 감지
    if(!_lsWarned){
      _lsWarned=true;
      alert('⚠️ 데이터 저장에 실패했습니다.\n브라우저가 로컬 저장소를 차단하고 있을 수 있어요.\nChrome에서 파일을 열어주세요.');
    }
  }
}
let _lsWarned=false;
// localStorage 사용 가능 여부 시작 시 체크
(function(){
  try{localStorage.setItem('__test__','1');localStorage.removeItem('__test__');}
  catch(e){alert('⚠️ 이 브라우저/환경에서는 데이터 저장이 지원되지 않습니다.\nChrome에서 파일을 열어 사용해주세요.');}
})();
const DAY_ICO={1:'✏️',2:'✏️',3:'✏️',4:'✏️',5:'✏️',6:'🔁',7:'⚡'};
function makeWeek(idx){const days={};for(let d=1;d<=7;d++)days[d]=[];return{idx,days,wrongCounts:{}}}
function makeLang(id,name,color='green'){return{id,name,color,weeks:[makeWeek(1)],openWeeks:[1],curWeek:1,curDay:1,streak:0,lastDate:null}}

const LANG_COLORS={
  green: {id:'green', label:'그린',  main:'#84a38d', light:'#d4eacc', text:'#5c7a65',
    g1:'#ecf7e6', g2:'#d4eacc', g3:'#b8d9a8', g4:'#84a38d', g5:'#5c7a65'},
  pink:  {id:'pink',  label:'핑크',  main:'#c47f8a', light:'#f5dde0', text:'#8a4a55',
    g1:'#fdf0f2', g2:'#f5dde0', g3:'#e8b8bf', g4:'#c47f8a', g5:'#8a4a55'},
  yellow:{id:'yellow',label:'옐로',  main:'#b89a4a', light:'#f5edcc', text:'#7a6220',
    g1:'#fdf8e8', g2:'#f5edcc', g3:'#e0d09a', g4:'#b89a4a', g5:'#7a6220'},
  blue:  {id:'blue',  label:'블루',  main:'#6a8fb5', light:'#d8e8f5', text:'#3a5f80',
    g1:'#edf4fb', g2:'#d8e8f5', g3:'#a8c8e8', g4:'#6a8fb5', g5:'#3a5f80'},
};
const COLOR_CHOICES=['pink','yellow','blue'];

function applyTheme(colorId){
  const c=LANG_COLORS[colorId]||LANG_COLORS.green;
  const r=document.documentElement.style;
  r.setProperty('--g1',c.g1);
  r.setProperty('--g2',c.g2);
  r.setProperty('--g3',c.g3);
  r.setProperty('--g4',c.g4);
  r.setProperty('--g5',c.g5);
}

let state=load();

// ── 마이그레이션: 구버전 단일 언어 state → 멀티 언어 구조 ──
if(!state){
  state={langs:[makeLang(1,'L1')],curLang:0,seenOnboarding:false};
}else if(!state.langs){
  // 구버전 state (weeks 배열 직접 보유) → 멀티 언어 구조로 이전
  const legacy=makeLang(1,'L1');
  // weeks가 있으면 그대로 이전, 없으면 빈 week 유지
  if(Array.isArray(state.weeks)&&state.weeks.length>0) legacy.weeks=state.weeks;
  if(state.openWeeks) legacy.openWeeks=state.openWeeks;
  if(state.curWeek)   legacy.curWeek=state.curWeek;
  if(state.curDay)    legacy.curDay=state.curDay;
  if(state.streak)    legacy.streak=state.streak;
  if(state.lastDate)  legacy.lastDate=state.lastDate;
  state={langs:[legacy],curLang:0,seenOnboarding:state.seenOnboarding||false};
  save(state); // 마이그레이션 즉시 저장 (재방문 시 재마이그레이션 방지)
}
if(state.curLang===undefined)state.curLang=0;
if(state.seenOnboarding===undefined)state.seenOnboarding=false;

// 구버전 '제N언어' 이름 → L1/L2/L3 자동 변환
state.langs.forEach((lang,i)=>{
  if(/^제\d언어$/.test(lang.name)) lang.name='L'+(i+1);
  if(!lang.color) lang.color=i===0?'green':COLOR_CHOICES[i-1]||COLOR_CHOICES[0];
});

// 현재 언어 데이터 접근 헬퍼
function cL(){return state.langs[state.curLang]}

function renderOnboarding(){
  const card=document.getElementById('ob-card');
  const pages=OB_CONTENT[obLang];
  const p=pages[obPage];
  const total=pages.length;
  const isLast=obPage===total-1;
  const dots=Array.from({length:total},(_,i)=>`<div class="ob-dot${i===obPage?' active':''}"></div>`).join('');

  /* ── 언어 선택 바 ── */
  const langBar=`<div class="ob-lang-bar">
    ${['ko','jp','en'].map(l=>`<button class="ob-lang-btn${obLang===l?' active':''}" onclick="setObLang('${l}')">${l.toUpperCase()}</button>`).join('')}
  </div>`;

  /* ── SVG / 이미지 영역 ── */
  let picHtml='';
  if(p.finalHeart){
    picHtml=`<div class="ob-pic" style="justify-content:center;align-items:center">
      <svg viewBox="0 0 140 100" width="140" fill="none">
        <path d="M70 85C70 85 18 55 18 30C18 17 28 8 40 8C51 8 60 16 70 27C80 16 89 8 100 8C112 8 122 17 122 30C122 55 70 85 70 85Z" fill="#84a38d" opacity=".2"/>
        <path d="M70 80C70 80 20 52 20 30C20 19 29 10 40 10C51 10 60 19 70 30C80 19 89 10 100 10C111 10 120 19 120 30C120 52 70 80 70 80Z" fill="#84a38d" opacity=".5"/>
        <path d="M70 74C70 74 22 49 22 30C22 21 30 13 40 13C51 13 60 22 70 34C80 22 89 13 100 13C110 13 118 21 118 30C118 49 70 74 70 74Z" fill="#84a38d"/>
      </svg>
    </div>`;
  }else{
    const svg=OB_SVGS[obPage];
    picHtml=`<div class="ob-pic" style="justify-content:center;align-items:center">${svg||''}</div>`;
  }

  /* ── 태그 칩 ── */
  const tagHtml=`<div style="display:inline-flex;align-items:center;gap:5px;background:var(--g4);border-radius:20px;padding:4px 13px;font-size:10px;font-weight:700;color:#fff;margin-bottom:10px;font-family:var(--ff)">${p.emoji} ${p.tag}</div>`;

  /* ── 소제목 [ ] ── */
  const titleHtml=p.title
    ?`<div style="font-size:11px;font-weight:700;color:var(--g4);margin:0 0 10px;font-family:var(--ff);letter-spacing:.01em">[ ${p.title} ]</div>`
    :'';

  /* ── 본문 ── */
  const bodyHtml=p.finalHeart
    ?`<div class="ob-text" style="font-size:14px;font-weight:700;color:var(--g4);line-height:2">${p.body.replace(/\n/g,'<br>')}</div>`
    :`<div class="ob-text">${p.body.replace(/\n/g,'<br>')}</div>`;

  /* ── 화살표 ── */
  const arrowBtn=isLast
    ?`<button class="ob-arrow" onclick="closeOnboarding()"><svg viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="14" fill="#84a38d"/><path d="M11 8 L19 14 L11 20" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
    :`<button class="ob-arrow" onclick="obNext()"><svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" stroke="#84a38d" stroke-width="2"/><path d="M11 8 L19 14 L11 20" stroke="#84a38d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;

  const skipLabel=isLast?(p.lastLabel||'Start!'):'Skip';

  card.innerHTML=`
    ${langBar}
    ${picHtml}
    <div style="text-align:center;width:100%">${tagHtml}</div>
    ${titleHtml}
    ${bodyHtml}
    <div class="ob-bottom">
      <button class="ob-skip" onclick="closeOnboarding()">${skipLabel}</button>
      <div class="ob-dots">${dots}</div>
      ${arrowBtn}
    </div>`;
}

function setObLang(lang){
  obLang=lang;
  obPage=0;
  renderOnboarding();
}
function obNext(){if(obPage<OB_CONTENT[obLang].length-1){obPage++;renderOnboarding()}}
function openOnboarding(){obPage=0;renderOnboarding();document.getElementById('onboarding').style.display='flex'}
function closeOnboarding(){document.getElementById('onboarding').style.display='none';state.seenOnboarding=true;save(state)}

function todayStr(){return new Date().toISOString().slice(0,10)}

/* ── 언어 모드 관리 ── */
function renderLangSwitcher(){
  const sw=document.getElementById('lang-switcher');
  sw.innerHTML='';
  state.langs.forEach((lang,i)=>{
    const c=LANG_COLORS[lang.color]||LANG_COLORS.green;
    const isActive=i===state.curLang;
    const btn=document.createElement('button');
    btn.className='lang-mode-btn'+(isActive?' active':'');
    btn.textContent=lang.name.slice(0,3);
    btn.title=lang.name;
    btn.style.borderColor=c.main;
    btn.style.color=isActive?'#fff':c.main;
    if(isActive) btn.style.background=c.main; else btn.style.background='';
    btn.onclick=()=>switchLang(i);
    sw.appendChild(btn);
  });
  const mgBtn=document.createElement('button');
  mgBtn.className='lang-add-btn';
  if(state.langs.length<3){mgBtn.textContent='+';mgBtn.title='언어 추가';}
  else{mgBtn.textContent='⚙';mgBtn.title='언어 관리';mgBtn.style.fontSize='11px';}
  mgBtn.onclick=openLangModal;
  sw.appendChild(mgBtn);
}

function switchLang(i){
  state.curLang=i;
  allFilter='all';pendingDel=null;curView='day';
  applyTheme(cL().color);
  save(state);render();
}

function openLangModal(){
  renderLangModal();
  document.getElementById('lang-modal-overlay').style.display='flex';
}
function closeLangModal(){
  document.getElementById('lang-modal-overlay').style.display='none';
}
window.closeLangModal=closeLangModal;

function renderLangModal(){
  const list=document.getElementById('lang-list');
  list.innerHTML='';
  state.langs.forEach((lang,i)=>{
    const c=LANG_COLORS[lang.color]||LANG_COLORS.green;
    const item=document.createElement('div');
    item.className='lang-item';
    item.style.borderLeft=`3px solid ${c.main}`;
    item.style.flexDirection='column';
    item.style.gap='8px';

    // 상단 행: 이름 + 편집 + 삭제
    const topRow=document.createElement('div');
    topRow.style.cssText='display:flex;align-items:center;gap:8px;width:100%';

    const nameEl=document.createElement('div');nameEl.className='lang-item-name';
    nameEl.textContent=lang.name;
    nameEl.style.color=c.text;

    const editBtn=document.createElement('button');editBtn.className='lang-item-edit';editBtn.textContent='이름 변경';
    editBtn.style.cssText=`background:${c.light};color:${c.text};border:none;white-space:nowrap`;

    const delBtn=document.createElement('button');delBtn.className='lang-item-del';delBtn.textContent='삭제';
    delBtn.disabled=state.langs.length<=1;

    topRow.appendChild(nameEl);

    // L2, L3만 색상 선택 스와치
    if(i>0){
      const swatchWrap=document.createElement('div');
      swatchWrap.style.cssText='display:flex;gap:5px;align-items:center;margin-right:2px';
      COLOR_CHOICES.forEach(cid=>{
        const cc=LANG_COLORS[cid];
        const sw=document.createElement('button');
        sw.title=cc.label;
        sw.style.cssText=`width:18px;height:18px;border-radius:50%;background:${cc.main};border:2.5px solid ${lang.color===cid?'#fff':'transparent'};box-shadow:${lang.color===cid?'0 0 0 2px '+cc.main:''};cursor:pointer;transition:.15s;flex-shrink:0;padding:0`;
        sw.onclick=()=>{lang.color=cid;save(state);if(i===state.curLang)applyTheme(cid);renderLangModal();renderLangSwitcher();};
        swatchWrap.appendChild(sw);
      });
      topRow.appendChild(swatchWrap);
    }

    topRow.appendChild(editBtn);
    topRow.appendChild(delBtn);
    item.appendChild(topRow);

    // 삭제 확인 인라인 행
    const delConfirmRow=document.createElement('div');
    delConfirmRow.style.cssText='display:none;gap:6px;width:100%;align-items:center;background:#fff0f0;border-radius:10px;padding:8px 10px';
    const delMsg=document.createElement('span');
    delMsg.style.cssText='font-size:10px;font-weight:700;color:#c05050;flex:1;font-family:var(--ff)';
    delMsg.textContent=`"${lang.name}" 삭제할까요?`;
    const delYes=document.createElement('button');delYes.className='lang-item-del';delYes.textContent='삭제';
    delYes.style.padding='4px 12px';
    delYes.onclick=()=>{
      state.langs.splice(i,1);
      if(state.curLang>=state.langs.length)state.curLang=state.langs.length-1;
      applyTheme(cL().color);
      save(state);renderLangModal();renderLangSwitcher();
      allFilter='all';pendingDel=null;curView='day';render();
    };
    const delNo=document.createElement('button');delNo.className='lang-item-edit';delNo.textContent='취소';
    delNo.style.padding='4px 10px';
    delNo.onclick=()=>{delConfirmRow.style.display='none';};
    delConfirmRow.appendChild(delMsg);delConfirmRow.appendChild(delYes);delConfirmRow.appendChild(delNo);

    delBtn.onclick=()=>{
      if(state.langs.length<=1)return;
      delConfirmRow.style.display='flex';
    };

    // 이름 편집 인라인 입력창 (처음엔 숨김)
    const editRow=document.createElement('div');
    editRow.style.cssText='display:none;gap:6px;width:100%';
    const nameInp=document.createElement('input');
    nameInp.className='lang-name-inp';
    nameInp.value=lang.name;
    nameInp.maxLength=12;
    nameInp.style.cssText=`flex:1;border-color:${c.main}`;
    const saveBtn=document.createElement('button');
    saveBtn.className='lang-confirm-btn';
    saveBtn.textContent='저장';
    saveBtn.style.cssText=`background:${c.main};white-space:nowrap`;
    const cancelBtn=document.createElement('button');
    cancelBtn.className='lang-item-edit';
    cancelBtn.textContent='취소';
    cancelBtn.style.cssText=`background:${c.light};color:${c.text};border:none;white-space:nowrap`;

    editBtn.onclick=()=>{
      editRow.style.display='flex';
      nameInp.value=lang.name;
      nameInp.focus();nameInp.select();
    };
    saveBtn.onclick=()=>{
      const v=nameInp.value.trim();
      if(v){lang.name=v;save(state);}
      editRow.style.display='none';
      renderLangModal();renderLangSwitcher();
    };
    cancelBtn.onclick=()=>{editRow.style.display='none';};
    nameInp.onkeydown=e=>{if(e.key==='Enter')saveBtn.click();if(e.key==='Escape')cancelBtn.click();};

    editRow.appendChild(nameInp);editRow.appendChild(saveBtn);editRow.appendChild(cancelBtn);
    item.appendChild(editRow);
    item.appendChild(delConfirmRow);
    list.appendChild(item);
  });

  const addArea=document.getElementById('lang-add-area');
  if(state.langs.length<3){
    addArea.innerHTML='';
    const row=document.createElement('div');row.className='lang-add-row';
    const defaultName='L'+(state.langs.length+1);
    const inp=document.createElement('input');inp.className='lang-name-inp';inp.placeholder=`이름 (기본: ${defaultName})`;inp.maxLength=12;
    const confirmBtn=document.createElement('button');confirmBtn.className='lang-confirm-btn';confirmBtn.textContent='+ 추가';
    confirmBtn.onclick=()=>{
      const name=inp.value.trim()||defaultName;
      const newId=Math.max(...state.langs.map(l=>l.id))+1;
      // 아직 안 쓴 색상 자동 배정
      const usedColors=state.langs.map(l=>l.color);
      const autoColor=COLOR_CHOICES.find(c=>!usedColors.includes(c))||COLOR_CHOICES[0];
      state.langs.push(makeLang(newId,name,autoColor));
      save(state);renderLangModal();renderLangSwitcher();
      inp.value='';
    };
    inp.onkeydown=e=>{if(e.key==='Enter')confirmBtn.click()};
    row.appendChild(inp);row.appendChild(confirmBtn);
    addArea.appendChild(row);
  }else{
    addArea.innerHTML=`<div style="font-size:11px;color:var(--g4);text-align:center;font-family:var(--ff);font-weight:600">최대 3개 언어까지 추가할 수 있어요.</div>`;
  }
}

function initCycle(){
  const t=todayStr();
  // 모든 언어 streak 업데이트
  state.langs.forEach(lang=>{
    if(lang.lastDate!==t){
      if(lang.lastDate){const d=Math.floor((new Date(t)-new Date(lang.lastDate))/86400000);lang.streak=d===1?lang.streak+1:1}
      else lang.streak=1;
      lang.lastDate=t;
    }
  });
  save(state);
  applyTheme(cL().color); // 앱 시작 시 현재 언어 테마 적용
  if(!state.seenOnboarding)openOnboarding();
  render();
}

function addWeek(){
  const lang=cL();
  const idx=lang.weeks.length?Math.max(...lang.weeks.map(w=>w.idx))+1:1;
  lang.weeks.push(makeWeek(idx));
  if(!lang.openWeeks.includes(idx))lang.openWeeks.push(idx);
  save(state);renderSidebar();
}
function toggleWeek(idx){
  const lang=cL();
  const i=lang.openWeeks.indexOf(idx);
  if(i>=0)lang.openWeeks.splice(i,1);else lang.openWeeks.push(idx);
  save(state);renderSidebar();
}
function confirmDel(idx){pendingDel=idx;renderSidebar()}
function cancelDel(){pendingDel=null;renderSidebar()}
function doDelete(idx){
  const lang=cL();
  lang.weeks=lang.weeks.filter(w=>w.idx!==idx);
  lang.openWeeks=lang.openWeeks.filter(i=>i!==idx);
  if(lang.curWeek===idx&&lang.weeks.length){lang.curWeek=lang.weeks[0].idx;lang.curDay=1}
  pendingDel=null;save(state);
  if(curView==='day')showDay(lang.curWeek,lang.curDay);
  renderSidebar();
}
function setupSwipe(el,idx){let sx=0,cx=0,going=false;const T=50;const s=e=>{sx=e.touches?e.touches[0].clientX:e.clientX;going=true;cx=0};const m=e=>{if(!going)return;const x=(e.touches?e.touches[0].clientX:e.clientX)-sx;if(x<0){cx=Math.max(x,-72);el.style.transform=`translateX(${cx}px)`}};const u=()=>{if(!going)return;going=false;if(cx<=-T){el.style.transform='';confirmDel(idx)}else{el.style.transform='';cx=0}};el.addEventListener('touchstart',s,{passive:true});el.addEventListener('touchmove',m,{passive:true});el.addEventListener('touchend',u);el.addEventListener('mousedown',s);document.addEventListener('mousemove',m);document.addEventListener('mouseup',u)}

function render(){
  const lang=cL();
  document.getElementById('streak').textContent='🔥 '+lang.streak+' days';
  renderLangSwitcher();
  renderSidebar();
  if(curView==='all')showAll();else showDay(lang.curWeek,lang.curDay);
}

function renderSidebar(){
  const lang=cL();
  const wl=document.getElementById('week-list');wl.innerHTML='';
  lang.weeks.forEach(week=>{
    const wi=week.idx,open=lang.openWeeks.includes(wi),isPend=pendingDel===wi;
    const block=document.createElement('div');block.className='week-block';
    const sw=document.createElement('div');sw.className='week-swipe-wrap';
    const bg=document.createElement('div');bg.className='week-delete-bg';bg.textContent='Delete';
    const hdr=document.createElement('div');hdr.className='week-header'+(open?' open':'');
    hdr.innerHTML=`<span style="font-size:14px">📅</span><span class="week-label">Week ${wi}</span><span class="week-arrow">▶</span>`;
    hdr.onclick=e=>{if(Math.abs(parseFloat(hdr.style.transform||'0'))>5)return;toggleWeek(wi)};
    sw.appendChild(bg);sw.appendChild(hdr);block.appendChild(sw);
    if(isPend){const c=document.createElement('div');c.className='confirm-overlay';c.innerHTML=`<p>Delete Week ${wi}? 🗑️</p><div class="btn-row"><button class="del-confirm-btn" onclick="doDelete(${wi})">Delete</button><button class="cancel-btn" onclick="cancelDel()">Cancel</button></div>`;block.appendChild(c)}
    const dd=document.createElement('div');dd.className='week-days '+(open?'expanded':'collapsed');
    for(let d=1;d<=7;d++){const b=document.createElement('button');b.className='day-btn'+(lang.curWeek===wi&&lang.curDay===d&&curView==='day'?' active':'');b.innerHTML=`<span style="font-size:12px">${DAY_ICO[d]}</span> Day ${d}`;b.onclick=(()=>{const ww=wi,dd2=d;return()=>{curView='day';document.getElementById('btn-all').classList.remove('active');lang.curWeek=ww;lang.curDay=dd2;save(state);renderSidebar();showDay(ww,dd2)}})();dd.appendChild(b)}
    block.appendChild(dd);wl.appendChild(block);setupSwipe(hdr,wi);
  });
}

function showAll(){
  const lang=cL();
  curView='all';document.getElementById('btn-all').classList.add('active');
  document.getElementById('day-label').textContent=`📋 ${lang.name} · All Words`;
  renderAllWords();
}
function renderAllWords(){
  const lang=cL();
  const c=document.getElementById('content');c.style.overflow='auto';c.style.display='block';
  const all=[];lang.weeks.forEach(w=>{for(let d=1;d<=5;d++)(w.days[d]||[]).forEach(x=>all.push({...x,week:w.idx,day:d}))});
  let html=`<div class="sec-title">📋 All Words <span style="font-size:11px;background:var(--g4);color:#fff;border-radius:20px;padding:2px 10px;font-weight:700">${lang.name}</span></div><div class="week-filter-bar">`;
  html+=`<button class="wf-btn${allFilter==='all'?' active':''}" onclick="setFilter('all')">All</button>`;
  lang.weeks.forEach(w=>{html+=`<button class="wf-btn${allFilter===w.idx?' active':''}" onclick="setFilter(${w.idx})">Week ${w.idx}</button>`});
  html+='</div>';
  const fil=allFilter==='all'?all:all.filter(x=>x.week===allFilter);
  if(!fil.length){html+='<p class="msg">No words saved yet.</p>';c.innerHTML=html;return}
  html+='<table class="vtable"><thead><tr><th>Word</th><th>Meaning</th><th>Week</th><th>Day</th><th>Errors</th></tr></thead><tbody>';
  fil.forEach(w=>{const wk=lang.weeks.find(x=>x.idx===w.week);const wc=wk?wk.wrongCounts[w.word]||0:0;html+=`<tr><td>${w.word}</td><td>${w.meaning}</td><td><span class="pill">W${w.week}</span></td><td><span class="pill">D${w.day}</span></td><td>${wc>0?'❌'.repeat(Math.min(wc,3)):'-'}</td></tr>`});
  html+='</tbody></table>';c.innerHTML=html;
}
function setFilter(v){allFilter=v;renderAllWords()}
function getWeek(idx){return cL().weeks.find(w=>w.idx===idx)}

function showDay(wIdx,d){
  const lang=cL();
  if(!wIdx||!getWeek(wIdx)){if(lang.weeks.length){wIdx=lang.weeks[0].idx;d=1}else{document.getElementById('content').innerHTML='<p class="msg">Add a week to get started!</p>';return}}
  lang.curWeek=wIdx;lang.curDay=d;save(state);
  document.getElementById('day-label').textContent=`${lang.name} · Week ${wIdx} · Day ${d}`+(d<=5?' · Input':d===6?' · Review':' · Hard');
  const content=document.getElementById('content');content.style.overflow='hidden';content.style.display='flex';content.style.flexDirection='column';
  const week=getWeek(wIdx);if(!week)return;
  if(d<=5)renderInputDay(week,d,content);else if(d===6)renderSummaryDay(week,content);else renderHardDay(week,content);
}

function getPool(week,d){
  if(d<=2)return[...(week.days[d]||[])];
  if(d===3)return[...(week.days[3]||[]),...(week.days[1]||[])];
  if(d===4)return[...(week.days[4]||[]),...(week.days[2]||[])];
  return[...(week.days[5]||[]),...(week.days[3]||[])];
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function startGame(wIdx,d){const w=getWeek(wIdx);if(!w)return;launchGame(wIdx,getPool(w,d),d)}

function launchGame(wIdx,pool,day){
  if(typeof pool==='string')pool=JSON.parse(pool);
  const shuffled=shuffle(pool);
  const pages=[];
  for(let i=0;i<shuffled.length;i+=8)pages.push(shuffled.slice(i,i+8));
  runSession(wIdx,pages,day);
}

function runSession(wIdx,pages,day){
  const allWrong=[];
  let pi=0;
  function next(){
    if(pi<pages.length){
      playPage(wIdx,pages[pi],day,pi,pages.length,false,
        (wrongList)=>{
          wrongList.forEach(x=>{if(!allWrong.find(a=>a.word===x.word))allWrong.push(x)});
          pi++;next();
        }
      );
    }else{
      if(allWrong.length>=2)showRetryScreen(wIdx,allWrong,day);
      else showFinal(wIdx,day,allWrong.length===0);
    }
  }
  next();
}

function showRetryScreen(wIdx,wrongWords,day){
  const c=document.getElementById('content');
  c.style.overflow='auto';c.style.display='block';
  const safeJson=JSON.stringify(wrongWords).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  c.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;padding:24px 0">
  <div class="result-box">
    <div style="font-size:36px;margin-bottom:10px">🔁</div>
    <h3>Review time!</h3>
    <p>You missed <b>${wrongWords.length}</b> word${wrongWords.length>1?'s':''}.<br>Let's go through them once more!</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn-start" id="retry-btn">▶ Retry Missed</button>
      <button class="btn-ghost" id="back-btn">← Back</button>
    </div>
  </div></div>`;
  document.getElementById('retry-btn').onclick=()=>startRetry(wIdx,wrongWords,day);
  document.getElementById('back-btn').onclick=()=>showDay(wIdx,day);
}

function startRetry(wIdx,words,day){
  const shuffled=shuffle(words);
  const pages=[];
  for(let i=0;i<shuffled.length;i+=8)pages.push(shuffled.slice(i,i+8));
  let pi=0;
  function next(){
    if(pi<pages.length){
      playPage(wIdx,pages[pi],day,pi,pages.length,true,()=>{pi++;next()});
    }else{
      showFinal(wIdx,day,false);
    }
  }
  next();
}

function showFinal(wIdx,day,perfect){
  const c=document.getElementById('content');
  c.style.overflow='auto';c.style.display='block';
  c.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;padding:24px 0">
  <div class="result-box">
    <div style="font-size:40px;margin-bottom:10px">${perfect?'🎉':'✨'}</div>
    <h3>${perfect?'Perfect!':'Great work!'}</h3>
    <p>${perfect?'Zero mistakes! 🌟':'All done.'}</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn-start" id="again-btn">↩ Again</button>
      <button class="btn-ghost" id="back-btn2">← Back</button>

function playPage(wIdx,pairs,day,pageIdx,totalPages,isRetry,onDone){
  const content=document.getElementById('content');
  content.style.overflow='hidden';content.style.display='flex';content.style.flexDirection='column';
  const week=getWeek(wIdx);
  let matched=new Set(),tries=0,wrong=0,locked=false,selWord=null,selMean=null;
  const pageWrong=[];
  const wCards=shuffle(pairs.map((p,i)=>({...p,idx:i})));
  const mCards=shuffle(pairs.map((p,i)=>({...p,idx:i})));
  const n=pairs.length;

  function renderGame(){
    const dots=Array.from({length:totalPages},(_,i)=>`<div class="page-dot${i===pageIdx?' active':''}"></div>`).join('');
    content.innerHTML=`
      <div class="page-dot-row">${dots}</div>
      <div class="info-bar">
        <div class="badge">${isRetry?'🔁 · ':''}✅ ${matched.size}/${n}</div>
        <div class="badge">🎯 ${tries}</div>
        <div class="badge">❌ ${wrong}</div>
      </div>
      <div class="match-layout" id="ml"></div>`;
    const ml=document.getElementById('ml');
    [wCards,mCards].forEach((cards,ci)=>{
      const wrap=document.createElement('div');wrap.className='col-wrap';wrap.style.cssText='display:flex;flex-direction:column;min-height:0';
      const lbl=document.createElement('div');lbl.className='col-lbl';lbl.textContent=ci===0?'Words':'Meanings';
      const col=document.createElement('div');col.className='col-cards';
      cards.forEach(p=>{
        const div=document.createElement('div');
        const isSel=ci===0?(selWord&&selWord.idx===p.idx):(selMean&&selMean.idx===p.idx);
        div.className='mcard'+(matched.has(p.idx)?' matched':'')+(isSel?' selected':'')+(locked?' locked':'');
        div.dataset.idx=p.idx;
        div.textContent=ci===0?p.word:p.meaning;
        if(!matched.has(p.idx)&&!locked)div.onclick=()=>ci===0?clickWord(p):clickMean(p);
        col.appendChild(div);
      });
      wrap.appendChild(lbl);wrap.appendChild(col);ml.appendChild(wrap);
    });
  }

  function clickWord(p){if(locked||matched.has(p.idx))return;selWord=p;renderGame();if(selMean)check()}
  function clickMean(p){if(locked||matched.has(p.idx))return;selMean=p;renderGame();if(selWord)check()}

  function check(){
    tries++;
    if(selWord.idx===selMean.idx){
      matched.add(selWord.idx);selWord=null;selMean=null;renderGame();
      if(matched.size===n)setTimeout(()=>onDone(pageWrong),300);
    }else{
      wrong++;
      const wo=selWord,mo=selMean;
      if(!pageWrong.find(x=>x.word===wo.word))pageWrong.push({word:wo.word,meaning:wo.meaning});
      if(week&&wo.word)week.wrongCounts[wo.word]=(week.wrongCounts[wo.word]||0)+1;
      save(state);locked=true;renderGame();
      const wE=document.querySelector(`#ml .col-cards:first-child .mcard[data-idx="${wo.idx}"]`);
      const mE=document.querySelector(`#ml .col-cards:last-child .mcard[data-idx="${mo.idx}"]`);
      if(wE)wE.classList.add('wrong');if(mE)mE.classList.add('wrong');
      setTimeout(()=>{locked=false;selWord=null;selMean=null;renderGame()},700);
    }
  }
  renderGame();
}

/* ── BULK IMPORT ── */
function parseBulkText(raw){
  const lines=raw.split('\n');
  const results=[];
  lines.forEach(line=>{
    const l=line.trim();
    if(!l)return;
    let word='',meaning='';

    // 1. 탭 구분자
    if(l.includes('\t')){
      const parts=l.split('\t');
      word=parts[0].trim();meaning=parts.slice(1).join('\t').trim();
    }
    // 2. 명시적 구분자: :  /  —  – (앞뒤 공백 포함)
    else if(/^(.+?)\s*[:\/—–]\s*(.+)$/.test(l)){
      const m=l.match(/^(.+?)\s*[:\/—–]\s*(.+)$/);
      word=m[1].trim();meaning=m[2].trim();
    }
    // 3. " - " 처럼 공백+하이픈+공백
    else if(/^(.+?)\s+-\s+(.+)$/.test(l)){
      const m=l.match(/^(.+?)\s+-\s+(.+)$/);
      word=m[1].trim();meaning=m[2].trim();
    }
    // 4. 라틴문자 → 비라틴(한글 등) 경계
    else if(/^([A-Za-z][A-Za-z0-9 ''\-]*?)\s+([\uAC00-\uD7A3\u3040-\u30FF\u4E00-\u9FFF].*)$/.test(l)){
      const m=l.match(/^([A-Za-z][A-Za-z0-9 ''\-]*?)\s+([\uAC00-\uD7A3\u3040-\u30FF\u4E00-\u9FFF].*)$/);
      word=m[1].trim();meaning=m[2].trim();
    }
    // 5. 비라틴 → 라틴 경계
    else if(/^([\uAC00-\uD7A3\u3040-\u30FF\u4E00-\u9FFF][^\s]*(?:\s+[^\s]+)*?)\s+([A-Za-z].*)$/.test(l)){
      const m=l.match(/^([\uAC00-\uD7A3\u3040-\u30FF\u4E00-\u9FFF][^\s]*(?:\s+[^\s]+)*?)\s+([A-Za-z].*)$/);
      word=m[1].trim();meaning=m[2].trim();
    }
    // 6. 첫 공백 fallback
    else{
      const spIdx=l.indexOf(' ');
      if(spIdx>0){word=l.slice(0,spIdx).trim();meaning=l.slice(spIdx+1).trim();}
      else{word=l;meaning='';}
    }

    if(word&&meaning)results.push({word,meaning,ok:true});
    else if(word)results.push({word,meaning:'',ok:false,raw:l});
  });
  return results;
}

let _bulkWIdx=null,_bulkD=null;

function openBulk(wIdx,d){
  _bulkWIdx=wIdx;_bulkD=d;
  const overlay=document.getElementById('bulk-overlay');
  const ta=document.getElementById('bulk-ta');
  ta.value='';
  document.getElementById('bulk-preview').innerHTML='';
  document.getElementById('bulk-count').textContent='';
  document.getElementById('bulk-add-btn').disabled=true;
  overlay.style.display='flex';
  setTimeout(()=>ta.focus(),80);
}

function closeBulk(){
  document.getElementById('bulk-overlay').style.display='none';
  _bulkWIdx=null;_bulkD=null;
}

function updateBulkPreview(){
  const raw=document.getElementById('bulk-ta').value;
  const parsed=parseBulkText(raw);
  const ok=parsed.filter(p=>p.ok);
  const preview=document.getElementById('bulk-preview');
  const count=document.getElementById('bulk-count');
  const addBtn=document.getElementById('bulk-add-btn');
  if(!parsed.length){preview.innerHTML='';count.textContent='';addBtn.disabled=true;return}
  count.textContent=`${ok.length} word${ok.length!==1?'s':''} ready to add${parsed.length>ok.length?' · '+(parsed.length-ok.length)+' skipped':''}`;
  preview.innerHTML=parsed.slice(0,8).map(p=>
    p.ok
      ?`<div class="bulk-preview-row"><span class="bpr-word">${p.word}</span><span class="bpr-sep">→</span><span class="bpr-mean">${p.meaning}</span></div>`
      :`<div class="bulk-preview-row err">⚠ "${p.raw}" — no meaning found</div>`
  ).join('')+(parsed.length>8?`<div style="font-size:10px;color:var(--g4);padding:2px 10px;font-family:var(--ff);font-weight:600">+${parsed.length-8} more...</div>`:'');
  addBtn.disabled=ok.length===0;
}

function commitBulk(){
  if(_bulkWIdx===null||_bulkD===null)return;
  const raw=document.getElementById('bulk-ta').value;
  const parsed=parseBulkText(raw).filter(p=>p.ok);
  if(!parsed.length){closeBulk();return}
  const wIdx=_bulkWIdx,d=_bulkD;
  const week=getWeek(wIdx);
  if(!week){closeBulk();return}
  parsed.forEach(p=>week.days[d].push({word:p.word,meaning:p.meaning}));
  save(state);
  // 모달 닫기 (변수 초기화 전에 week, d 이미 로컬에 저장됨)
  document.getElementById('bulk-overlay').style.display='none';
  _bulkWIdx=null;_bulkD=null;
  // 단어 목록 및 카운터 즉시 갱신
  renderWordList(week,d);
}

// 유니코드 안전 Base64 인코딩/디코딩
// JSON 키를 짧게 줄여서 Base64 크기 최소화
function compressPayload(obj){
  return JSON.stringify(obj)
    .replace(/"wrongCounts":/g,'"§E":')
    .replace(/"lastDate":/g,'"§L":')
    .replace(/"openWeeks":/g,'"§oW":')
    .replace(/"curWeek":/g,'"§cW":')
    .replace(/"curDay":/g,'"§cD":')
    .replace(/"_multiLang":/g,'"§ML":')
    .replace(/"exportedAt":/g,'"§eA":')
    .replace(/"_delta":/g,'"§d":')
    .replace(/"_days":/g,'"§dd":')
    .replace(/"streak":/g,'"§S":')
    .replace(/"meaning":/g,'"§m":')
    .replace(/"color":/g,'"§c":')
    .replace(/"langs":/g,'"§lg":')
    .replace(/"delta":/g,'"§dt":')
    .replace(/"weeks":/g,'"§W":')
    .replace(/"days":/g,'"§D":')
    .replace(/"word":/g,'"§w":')
    .replace(/"name":/g,'"§n":')
    .replace(/"idx":/g,'"§i":');
}
function decompressPayload(json){
  return json
    .replace(/"§oW":/g,'"openWeeks":')
    .replace(/"§cW":/g,'"curWeek":')
    .replace(/"§cD":/g,'"curDay":')
    .replace(/"§ML":/g,'"_multiLang":')
    .replace(/"§eA":/g,'"exportedAt":')
    .replace(/"§dd":/g,'"_days":')
    .replace(/"§d":/g,'"_delta":')
    .replace(/"§E":/g,'"wrongCounts":')
    .replace(/"§L":/g,'"lastDate":')
    .replace(/"§S":/g,'"streak":')
    .replace(/"§m":/g,'"meaning":')
    .replace(/"§c":/g,'"color":')
    .replace(/"§lg":/g,'"langs":')
    .replace(/"§dt":/g,'"delta":')
    .replace(/"§W":/g,'"weeks":')
    .replace(/"§D":/g,'"days":')
    .replace(/"§w":/g,'"word":')
    .replace(/"§n":/g,'"name":')
    .replace(/"§i":/g,'"idx":');
}

function encodeData(obj){
  return btoa(unescape(encodeURIComponent(compressPayload(obj))));
}

function decodeData(str){
  try{
    const compressed=decodeURIComponent(escape(atob(str.trim())));
    const json=compressed.includes('"§')
      ?decompressPayload(compressed):compressed;
    return JSON.parse(json);
  }catch{return null}
}

// 단어가 있는 모든 day 포함 (날짜 역산 방식 폐기 — JS 음수 모듈러 버그)
function buildDeltaPayload(lang, days=3){
  const deltaWeeks=(lang.weeks||[]).map(week=>{
    const deltaDays={};
    for(let d=1;d<=7;d++){
      const words=week.days[d]||[];
      if(words.length>0)deltaDays[d]=words;
    }
    if(Object.keys(deltaDays).length===0)return null;
    return{idx:week.idx,days:deltaDays,wrongCounts:week.wrongCounts||{}};
  }).filter(Boolean);
  return{_delta:true,_days:days,weeks:deltaWeeks,streak:lang.streak||0,lastDate:lang.lastDate||null};
}

// delta 데이터를 기존 state에 병합
function mergeDelta(base, delta){
  const result=JSON.parse(JSON.stringify(base)); // deep clone
  delta.weeks.forEach(dWeek=>{
    const existing=result.weeks.find(w=>w.idx===dWeek.idx);
    if(existing){
      // 해당 day 덮어쓰기
      Object.keys(dWeek.days).forEach(d=>{
        existing.days[d]=dWeek.days[d];
      });
      // wrongCounts 병합 (더 큰 값 우선)
      Object.keys(dWeek.wrongCounts||{}).forEach(word=>{
        existing.wrongCounts[word]=Math.max(
          existing.wrongCounts[word]||0,
          dWeek.wrongCounts[word]||0
        );
      });
    }else{
      // 없는 week면 새로 추가 (days 빈 것 채워서)
      const fullDays={};
      for(let d=1;d<=7;d++) fullDays[d]=dWeek.days[d]||[];
      result.weeks.push({idx:dWeek.idx,days:fullDays,wrongCounts:dWeek.wrongCounts||{}});
    }
  });
  // streak/lastDate는 더 최신 값으로
  if(delta.lastDate && delta.lastDate>=(result.lastDate||'')){
    result.streak=delta.streak;
    result.lastDate=delta.lastDate;
  }
  return result;
}

let _syncExportCode='';

function openSync(){
  // 모든 언어의 delta를 합산
  const langDeltas=state.langs.map(lang=>{
    const delta=buildDeltaPayload(lang,3);
    return{id:lang.id,name:lang.name,delta};
  });
  const payload={
    _multiLang:true,
    _delta:true,
    _days:3,
    langs:langDeltas,
    exportedAt:todayStr()
  };
  _syncExportCode=encodeData(payload);

  const box=document.getElementById('sync-export-box');
  box.textContent=_syncExportCode;

  // 크기 안내
  let totalWords=0;
  langDeltas.forEach(l=>l.delta.weeks.forEach(w=>Object.values(w.days).forEach(arr=>totalWords+=arr.length)));
  const fullSize=encodeData({langs:state.langs}).length;
  const deltaSize=_syncExportCode.length;
  const saving=fullSize>deltaSize?Math.round((1-deltaSize/fullSize)*100):0;

  document.getElementById('sync-size-hint').textContent=
    `${state.langs.length}개 언어 · 최근 3일 · ${totalWords}개 단어 · ${deltaSize}자${saving>0?' (전체 대비 '+saving+'% 절약)':''}`;

  document.getElementById('sync-import-ta').value='';
  document.getElementById('sync-import-btn').disabled=true;
  const copyBtn=document.getElementById('sync-copy-btn');
  copyBtn.innerHTML='<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M3 11V3a2 2 0 0 1 2-2h8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg> 전체 복사';
  copyBtn.classList.remove('copied');
  document.getElementById('sync-overlay').style.display='flex';
}
function closeSync(){
  document.getElementById('sync-overlay').style.display='none';
}
window.openSync=openSync;
window.closeSync=closeSync;

document.getElementById('sync-copy-btn').addEventListener('click',function(){
  const btn=this;
  function onSuccess(){
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8l4 4 8-8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> 복사됨!';
    btn.classList.add('copied');
    setTimeout(()=>{
      btn.innerHTML='<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M3 11V3a2 2 0 0 1 2-2h8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg> 전체 복사';
      btn.classList.remove('copied');
    },2200);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(_syncExportCode).then(onSuccess).catch(()=>fallbackCopy(btn));
  }else{fallbackCopy(btn)}
});

function fallbackCopy(btn){
  // textarea를 임시 생성해서 복사
  const ta=document.createElement('textarea');
  ta.value=_syncExportCode;
  ta.style.cssText='position:fixed;top:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.select();ta.setSelectionRange(0,99999);
  try{
    document.execCommand('copy');
    btn.innerHTML='<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8l4 4 8-8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> 복사됨!';
    btn.classList.add('copied');
    setTimeout(()=>{
      btn.innerHTML='<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="2" stroke="#fff" stroke-width="1.6"/><path d="M3 11V3a2 2 0 0 1 2-2h8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg> 전체 복사';
      btn.classList.remove('copied');
    },2200);
  }catch{alert('복사에 실패했습니다. 코드를 직접 선택해서 복사해주세요.')}
  document.body.removeChild(ta);
}

document.getElementById('sync-import-ta').addEventListener('input',function(){
  const v=this.value.trim();
  const btn=document.getElementById('sync-import-btn');
  if(!v){btn.disabled=true;return}
  const decoded=decodeData(v);
  if(decoded&&(decoded.langs||decoded.weeks||decoded._multiLang)){btn.disabled=false;return}
  try{const p=JSON.parse(v);btn.disabled=!(p&&(p.langs||p.weeks||p._multiLang));}
  catch{btn.disabled=true;}
});

document.getElementById('sync-import-btn').addEventListener('click',function(){
  const raw=document.getElementById('sync-import-ta').value.trim();
  let parsed=decodeData(raw);
  if(!parsed){try{parsed=JSON.parse(raw)}catch{parsed=null}}
  if(!parsed){alert('유효하지 않은 코드입니다.');return}

  if(parsed._multiLang&&parsed.langs){
    // 멀티언어 delta 병합
    const ok=confirm(`${parsed.langs.length}개 언어의 최근 3일 데이터를 병합합니다.\n기존 데이터는 유지되고, 가져온 day의 단어만 덮어씁니다.\n계속하시겠습니까?`);
    if(!ok)return;
    parsed.langs.forEach(incoming=>{
      const existing=state.langs.find(l=>l.id===incoming.id);
      if(existing){
        // 기존 언어에 delta 병합
        const merged=mergeDelta(existing,incoming.delta);
        Object.assign(existing,{weeks:merged.weeks,streak:merged.streak,lastDate:merged.lastDate});
      }else if(state.langs.length<3){
        // 새 언어 추가
        const newLang=makeLang(incoming.id,incoming.name);
        const merged=mergeDelta(newLang,incoming.delta);
        newLang.weeks=merged.weeks;newLang.streak=merged.streak;newLang.lastDate=merged.lastDate;
        state.langs.push(newLang);
      }
    });
    state.seenOnboarding=true;
    try{localStorage.setItem(SK,JSON.stringify(state));location.reload();}
    catch(e){alert('저장 중 오류: '+e.message)}
  }else if(parsed.weeks){
    // 구버전 단일언어 → 현재 언어에 병합
    const ok=confirm('단일 언어 데이터를 현재 언어('+cL().name+')에 가져옵니다.\n계속하시겠습니까?');
    if(!ok)return;
    if(parsed._delta){
      const merged=mergeDelta(cL(),parsed);
      Object.assign(cL(),{weeks:merged.weeks,streak:merged.streak,lastDate:merged.lastDate});
    }else{
      cL().weeks=parsed.weeks||cL().weeks;
      if(parsed.streak)cL().streak=parsed.streak;
      if(parsed.lastDate)cL().lastDate=parsed.lastDate;
    }
    state.seenOnboarding=true;
    try{localStorage.setItem(SK,JSON.stringify(state));location.reload();}
    catch(e){alert('저장 중 오류: '+e.message)}
  }else{
    alert('유효하지 않은 형식입니다.');
  }
});

document.getElementById('sync-overlay').addEventListener('click',function(e){
  if(e.target===this)closeSync();
});

initCycle();
